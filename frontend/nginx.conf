server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 5 MB by the API; leave room for multipart overhead.
    client_max_body_size 6m;

    # Resolve the backend through Docker's DNS on each request (cached 10s) instead of once at
    # startup, so recreating the backend container doesn't leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8787;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback so deep links work.
    location / {
        try_files $uri /index.html;
    }
}
