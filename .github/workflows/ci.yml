name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on master or a tag: it may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lost_and_found_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ["3306:3306"]
        # A real query as the app user: mysqladmin ping also passes during first-time init.
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -utest -ptest -e 'SELECT 1' lost_and_found_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_DSN: test:test@tcp(127.0.0.1:3306)/lost_and_found_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: Test (including MySQL repository tests)
        run: go test -race -count=1 ./...
      - run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  config:
    name: Compose and monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - name: Prometheus config
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/p:ro" prom/prometheus:v3.13.4 check config /p/prometheus.yml
      - name: Grafana dashboard is valid JSON
        run: jq empty monitoring/grafana/dashboards/*.json

  # Builds both images on every run; publishes to GHCR only from master and v* tags, after all checks pass.
  images:
    name: Image (${{ matrix.component }})
    needs: [backend, frontend, config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name
        # GHCR needs lowercase names.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
