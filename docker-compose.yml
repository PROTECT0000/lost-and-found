# Local S3-compatible storage for development (SeaweedFS).
# S3 endpoint: http://localhost:8333 (access key: devaccesskey / secret: devsecretkey)
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  create-bucket:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do sleep 1; done;
      echo 's3.bucket.create -name lost-and-found' | weed shell -master=seaweedfs:9333;
      "

volumes:
  seaweedfs-data:
